[build]
  command = "vite build"
  publish = "dist/client"
  functions = ".netlify/functions"

[dev]
  targetPort = 5173

# TanStack Start SSR: route everything that isn't a static file to the SSR function.
# Static assets (favicon, robots, hashed assets) win over rewrites automatically.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[build.environment]
  NODE_VERSION = "22"
